name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Workout\n2. Tap Log\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where are you using Replift?
      options: [Web app in a browser, Installed web app (PWA), Android APK, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → About shows the version.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Pixel 7, Chrome 130
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra details
